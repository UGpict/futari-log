substitutions:
  _REGION: asia-northeast1
  _SERVICE: futari-log
  _AR_REPO: futari-log
  _MEMORY: 1Gi
  _CPU: "1"
  _APP_RUNTIME: MOCK
  _ORCA_BASE: https://api.orcarouter.ai/v1
  _ORCA_MUNDANE: orcarouter/futari-mundane
  _ORCA_HARD: orcarouter/futari-hard
  _TAG: latest
  # Tournament calendar stickers (display-only). Set true for demo day.
  _DEMO_CALENDAR_STICKERS: "false"
  _DEMO_CALENDAR_ANCHOR_DATE: "2026-09-21"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - GIT_COMMIT=$_TAG
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/app:$_TAG
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/app:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/app

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/app:$_TAG
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=$_MEMORY
      - --cpu=$_CPU
      - --min-instances=1
      - --no-cpu-throttling
      - --timeout=300
      - --set-env-vars=NODE_ENV=production,APP_RUNTIME=$_APP_RUNTIME,ENABLE_DEMO_CONTROLS=true,COOKIE_SECURE=true,DATA_BACKEND=firestore,FIREBASE_PROJECT_ID=$PROJECT_ID,NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID,ORCAROUTER_BASE_URL=$_ORCA_BASE,ORCAROUTER_MUNDANE_MODEL=$_ORCA_MUNDANE,ORCAROUTER_HARD_MODEL=$_ORCA_HARD,DEMO_AREA_NAME=東京駅周辺,DEMO_LAT=35.681236,DEMO_LNG=139.767125,DEMO_CALENDAR_STICKERS=$_DEMO_CALENDAR_STICKERS,DEMO_CALENDAR_ANCHOR_DATE=$_DEMO_CALENDAR_ANCHOR_DATE,WORKER_CONCURRENCY=1
      - --set-secrets=ORCAROUTER_API_KEY=ORCAROUTER_API_KEY:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,NEXT_PUBLIC_FIREBASE_API_KEY=NEXT_PUBLIC_FIREBASE_API_KEY:latest,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:latest,NEXT_PUBLIC_FIREBASE_APP_ID=NEXT_PUBLIC_FIREBASE_APP_ID:latest

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/app:$_TAG
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/app:latest
