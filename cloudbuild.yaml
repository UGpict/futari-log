substitutions:
  _REGION: asia-northeast1
  _SERVICE: futari-log
  _AR_REPO: futari-log
  _MEMORY: 1Gi
  _CPU: "1"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - GIT_COMMIT=$SHORT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/app:$SHORT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/app:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/app

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/app:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=$_MEMORY
      - --cpu=$_CPU
      - --min-instances=1
      - --no-cpu-throttling
      - --timeout=300
      - --set-env-vars=NODE_ENV=production,APP_RUNTIME=MOCK,ENABLE_DEMO_CONTROLS=true,COOKIE_SECURE=true,DATA_BACKEND=firestore,FIREBASE_PROJECT_ID=$PROJECT_ID,NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID
      - --set-secrets=ORCAROUTER_API_KEY=ORCAROUTER_API_KEY:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,NEXT_PUBLIC_FIREBASE_API_KEY=NEXT_PUBLIC_FIREBASE_API_KEY:latest,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:latest,NEXT_PUBLIC_FIREBASE_APP_ID=NEXT_PUBLIC_FIREBASE_APP_ID:latest

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/app:$SHORT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/app:latest
